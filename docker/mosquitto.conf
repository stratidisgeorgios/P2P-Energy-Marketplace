# Mosquitto Configuration for Energy Trading Platform
# Tested with Mosquitto 2.1.2

# Default listener on port 1883
listener 1883
protocol mqtt

# WebSocket support on port 9001
listener 9001
protocol websockets

# Allow anonymous connections (use authentication in production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

